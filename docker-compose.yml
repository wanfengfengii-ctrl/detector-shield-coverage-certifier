services:
  api:
    build:
      context: ./backend
    image: shield-board-api:latest
    environment:
      - PYTHONUNBUFFERED=1
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200 else 1)"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 5s

  web:
    build:
      context: ./frontend
    image: shield-board-web:latest
    ports:
      - "8080:80"
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/80' || exit 1"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 5s

  verify:
    build:
      context: .
      dockerfile: verify/Dockerfile
    image: shield-board-verify:latest
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      - API_URL=http://api:8000/api/health
      - WEB_URL=http://web/
    # 浏览器在容器内以 root 运行需要 --no-sandbox，Playwright 对 root 自动启用
    command: ["bash", "/workspace/verify/run-tests.sh"]
